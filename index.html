<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYMARI | Accesorios</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="toast-notification" class="toast">¡Añadido al carrito! ✨</div>

    <header id="main-header">
        <nav class="nav-container">
            <div class="logo" onclick="volverTienda()">BYMARI</div>
            <ul class="nav-links" id="menu-categorias">
                <li><a href="#" data-categoria="inicio">INICIO</a></li>
            </ul>

            <div class="nav-right-mobile">
                <div class="header-search">
                    <svg class="search-icon-header" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Buscar...">
                </div>
                <button id="cart-btn" class="cart-trigger">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span id="cart-count">0</span>
                </button>
            </div>
        </nav>
    </header>

    <div id="tienda-content">
        <section class="hero-wrapper">
            <div class="slide active" id="main-banner">
                <div class="hero-content">
                    <p class="subtitle">Tienda Online</p>
                    <h1 class="playfair">BYMARI</h1>
                    <a href="#productos" class="btn-shop-white">VER PRODUCTOS</a>
                </div>
            </div>
        </section>

        <main id="productos">
            <div class="section-header">
                <span class="section-subtitle">Colección 2026</span>
                <h2 class="section-title playfair"></h2>
                <div class="header-line"></div>
            </div>
            <div class="filters-container">
                <div class="filter-group">
                    <label for="filterPrice">Ordenar por:</label>
                    <select id="filterPrice">
                        <option value="default">Relevancia</option>
                        <option value="low">Menor precio</option>
                        <option value="high">Mayor precio</option>
                    </select>
                </div>
            </div>
            <div class="product-grid" id="grid-productos"></div>
        </main>

        <footer class="main-footer">
            <div class="logo-footer">BYMARI</div>
            <p class="footer-tagline">Accesorios con estilo</p>
            <div class="social-container-footer">
                <a href="https://www.instagram.com/bymariok/" target="_blank" class="social-link-footer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    <span>@bymariok</span>
                </a>
            </div>
        </footer>
    </div>

    <section id="checkout-section" style="display: none; padding: 140px 5% 50px;">
        <div class="checkout-card">
            <h2 class="playfair" style="margin-bottom: 20px; color: var(--primary);">Datos de Envío</h2>
            <form id="checkout-form">
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" id="check-name" placeholder="Nombre completo *" required style="padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                    <input type="tel" id="check-phone" placeholder="Teléfono de contacto *" required style="padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                    <input type="text" id="check-address" placeholder="Dirección de entrega" style="padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                    <select id="check-payment" required style="padding: 12px; border-radius: 10px; border: 1px solid #ddd; background: white;">
                        <option value="" disabled selected>Método de Pago *</option>
                        <option value="Transferencia">Transferencia / Efectivo</option>
                        <option value="Tarjeta (3 cuotas)">Tarjeta (3 cuotas sin interés - +25% recargo)</option>
                    </select>
                </div>
                <button type="submit" style="width: 100%; margin-top: 25px; padding: 15px; background: #25d366; color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                    ENVIAR PEDIDO POR WHATSAPP
                </button>
                <button type="button" onclick="volverTienda()" style="width: 100%; margin-top: 10px; background: none; border: none; color: #888; text-decoration: underline; cursor: pointer;">
                    Volver a la tienda
                </button>
            </form>
        </div>
    </section>

    <div id="side-cart" class="cart-sidebar">
        <div class="cart-header">
            <h2 class="playfair">MI CARRITO</h2>
            <div id="close-sidebar" style="cursor:pointer; font-size:2rem;">&times;</div>
        </div>
        <div id="cartItems" class="cart-body"></div>
        <div class="cart-footer">
            <div class="subtotal-row" style="display: flex; justify-content: space-between; font-weight:bold; margin-bottom: 15px;">
                <span>TOTAL:</span><span id="total-price-sidebar">$0</span>
            </div>
            <button id="btn-to-checkout" class="btn-finalize">FINALIZAR COMPRA</button>
            <button id="btn-vaciar-carrito" class="btn-vaciar" type="button">VACIAR CARRITO</button>
        </div>
    </div>

    <a href="https://wa.me/5493813520315" class="whatsapp-float" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </a>

    <div id="image-modal" class="image-modal">
        <div class="image-modal-content">
            <button id="close-image-modal" class="image-modal-close" aria-label="Cerrar imagen">&times;</button>
            <img id="modal-image" src="" alt="Imagen ampliada del producto">
            <div id="modal-image-title" class="image-modal-title"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
